<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar · Stand Up Seeker</title><style>
:root{--blue:#063a6b;--ink:#07121d;--paper:#eef5fb;--card:#fff;--muted:#697888;--line:#cbd9e6;--red:#e53332;--green:#2b9a54}*{box-sizing:border-box}body{margin:0;background:#07121d;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}.app{max-width:900px;margin:auto;background:var(--paper);min-height:100vh;padding:24px 18px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.brand{font-weight:950;text-transform:uppercase;color:var(--blue);font-size:27px;letter-spacing:-.04em}.brand span{color:#0b75c9}.back{color:var(--blue);text-decoration:none;font-weight:800}.controls{display:flex;align-items:center;gap:8px;margin:22px 0 14px}.controls button{border:1px solid var(--line);background:white;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.controls h1{font-family:Georgia,serif;font-size:30px;margin:0 auto}.filter{background:white;border:1px solid var(--line);border-radius:13px;padding:11px 13px;width:min(330px,100%);font:inherit;margin-bottom:15px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;color:var(--muted);font-size:11px;font-weight:900;text-align:center;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}.day{min-height:110px;background:white;border:1px solid var(--line);border-radius:12px;padding:8px;overflow:hidden}.day.blank{background:transparent;border-color:transparent}.num{font-weight:900;font-size:12px;margin-bottom:6px}.show{display:block;text-decoration:none;color:var(--ink);background:#f2f7fb;border-radius:8px;padding:6px;margin:4px 0;font-size:10px;line-height:1.25}.show b{display:block}.show .time{color:var(--muted)}.more{font-size:10px;color:var(--blue);font-weight:800}.status{color:var(--muted);font-size:12px;margin:12px 0}.status b{color:var(--green)}.list{margin-top:20px}.row{background:white;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center}.date{font-weight:900}.name{font-family:Georgia,serif;font-size:19px;font-weight:700}.venue{font-size:12px;color:var(--muted);margin-top:3px}.ticket{background:var(--red);color:white;text-decoration:none;border-radius:9px;padding:8px 10px;font-size:11px;font-weight:850}.empty{text-align:center;color:var(--muted);padding:40px}.tabs{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(730px,calc(100% - 20px));background:rgba(5,20,32,.96);border-radius:20px;display:grid;grid-template-columns:repeat(4,1fr);padding:7px}.tab{text-align:center;padding:9px;color:#a8b8c7;text-decoration:none;font-size:11px;border-radius:12px}.tab.active{background:#103650;color:white}@media(max-width:650px){.app{padding-left:10px;padding-right:10px}.day{min-height:82px;padding:5px}.show{padding:4px;font-size:9px}.show .venueShort{display:none}.row{grid-template-columns:60px 1fr}.ticket{grid-column:2;justify-self:start}.controls h1{font-size:23px}}
</style></head><body><main class="app"><div class="top"><div class="brand">Stand Up <span>Seeker</span></div><a class="back" href="/">← Discover</a></div><div class="controls"><button id="prev" aria-label="Previous month">←</button><h1 id="monthTitle"></h1><button id="next" aria-label="Next month">→</button></div><input id="filter" class="filter" placeholder="Filter this month by comedian…" autocomplete="off"><div class="status"><b>●</b> Verified + publishable shows only · <span id="count">Loading…</span></div><div class="week"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div><div id="grid" class="grid"></div><section id="list" class="list"></section></main><nav class="tabs"><a class="tab" href="/">Discover</a><a class="tab active" href="/calendar.html">Calendar</a><a class="tab" href="/map.html">Map</a><span class="tab">Watchlist</span></nav><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const safeUrl=v=>{try{const u=new URL(v,location.origin);return /^https?:$/.test(u.protocol)?esc(u.href):''}catch{return ''}};let cursor=new Date();cursor=new Date(cursor.getFullYear(),cursor.getMonth(),1);let rows=[];const title=document.getElementById('monthTitle'),grid=document.getElementById('grid'),list=document.getElementById('list'),filter=document.getElementById('filter'),count=document.getElementById('count');function key(){return `${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}`}function time(t){if(!t)return '';const [h,m]=t.split(':').map(Number);return new Date(2000,0,1,h,m).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}function visible(){const q=filter.value.trim().toLowerCase();return q?rows.filter(x=>(x.name||'').toLowerCase().includes(q)):rows}function draw(){title.textContent=cursor.toLocaleDateString(undefined,{month:'long',year:'numeric'});const v=visible(),by={};v.forEach(x=>(by[x.date]??=[]).push(x));count.textContent=`${v.length} show${v.length===1?'':'s'}`;const first=new Date(cursor.getFullYear(),cursor.getMonth(),1).getDay(),days=new Date(cursor.getFullYear(),cursor.getMonth()+1,0).getDate();let html='';for(let i=0;i<first;i++)html+='<div class="day blank"></div>';for(let d=1;d<=days;d++){const date=`${key()}-${String(d).padStart(2,'0')}`,shows=by[date]||[];html+=`<div class="day"><div class="num">${d}</div>${shows.slice(0,3).map(x=>{const url=safeUrl(x.ticketUrl);return `<${url?'a':'div'} class="show" ${url?`href="${url}" target="_blank" rel="noopener noreferrer"`:''}><b>${esc(x.name)}</b><span class="time">${esc(time(x.time))}</span><span class="venueShort"> · ${esc(x.venue)}</span></${url?'a':'div'}>`}).join('')}${shows.length>3?`<div class="more">+${shows.length-3} more below</div>`:''}</div>`}grid.innerHTML=html;list.innerHTML=v.length?v.map(x=>{const url=safeUrl(x.ticketUrl);return `<article class="row"><div class="date">${new Date(x.date+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}<br><small>${esc(time(x.time))}</small></div><div><div class="name">${esc(x.name)}</div><div class="venue">${esc(x.venue)} · ${esc(x.city)}${x.state?', '+esc(x.state):''}</div></div>${url?`<a class="ticket" href="${url}" target="_blank" rel="noopener noreferrer">Tickets →</a>`:''}</article>`}).join(''):'<div class="empty">No verified shows found for this month.</div>'}async function load(){count.textContent='Loading…';grid.innerHTML='';list.innerHTML='';try{const r=await fetch(`/api/events?view=calendar&month=${key()}`),d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load calendar');rows=d.events||[];draw()}catch(e){count.textContent='Unavailable';list.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}document.getElementById('prev').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);load()};document.getElementById('next').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);load()};filter.oninput=draw;load();
</script></body></html>
