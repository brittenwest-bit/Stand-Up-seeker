<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Map · Stand Up Seeker</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:system-ui;background:#0c0c0f;color:#fff}header{padding:16px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}a{color:#fff}.controls{padding:0 22px 14px;display:flex;gap:10px;flex-wrap:wrap}.controls input{min-width:220px;padding:10px 12px;border-radius:9px;border:1px solid #444;background:#17171c;color:#fff}.note{padding:0 22px 14px;color:#bbb}#map{height:calc(100vh - 170px);min-height:440px}.leaflet-popup-content{color:#111;min-width:220px}.leaflet-popup-content a{color:#111}.show{margin-top:8px;padding-top:8px;border-top:1px solid #ddd}</style></head><body><header><strong>Stand Up Seeker · Map</strong><a href="/">Discover</a><a href="/calendar.html">Calendar</a></header><div class="controls"><input id="comedian" type="search" placeholder="Filter by comedian" autocomplete="off"><input id="city" type="search" placeholder="Filter by city" autocomplete="off"></div><div class="note" id="status">Loading verified venue locations…</div><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([39,-98],4);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let all=[];let markers=[];
fetch('/api/events?view=map').then(r=>{if(!r.ok)throw new Error('map api');return r.json()}).then(data=>{all=(data.events||[]).filter(e=>Number.isFinite(e.latitude)&&Number.isFinite(e.longitude));render()}).catch(()=>document.getElementById('status').textContent='Verified map data is temporarily unavailable.');
document.getElementById('comedian').addEventListener('input',render);document.getElementById('city').addEventListener('input',render);
function render(){markers.forEach(m=>map.removeLayer(m));markers=[];const cq=document.getElementById('comedian').value.trim().toLowerCase();const cityq=document.getElementById('city').value.trim().toLowerCase();const filtered=all.filter(e=>(!cq||String(e.name||'').toLowerCase().includes(cq))&&(!cityq||String(e.city||'').toLowerCase().includes(cityq)));const venues=new Map();filtered.forEach(e=>{const key=`${e.latitude}|${e.longitude}|${e.venue||''}`;if(!venues.has(key))venues.set(key,[]);venues.get(key).push(e)});const bounds=[];venues.forEach(events=>{events.sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.time||'').localeCompare(String(b.time||'')));const e=events[0];const m=L.marker([e.latitude,e.longitude]).addTo(map);markers.push(m);bounds.push([e.latitude,e.longitude]);const place=`${esc(e.venue)}<br>${esc(e.city)}, ${esc(e.state||e.country||'')}`;const shows=events.map(s=>{const when=[s.date,s.time].filter(Boolean).join(' ');const ticket=s.ticketUrl?`<br><a href="${safeUrl(s.ticketUrl)}" target="_blank" rel="noopener noreferrer">Official tickets</a>`:'';return `<div class="show"><strong>${esc(s.name)}</strong><br>${esc(when)}${ticket}</div>`}).join('');m.bindPopup(`${place}${shows}`)});if(bounds.length)map.fitBounds(bounds,{padding:[30,30],maxZoom:12});document.getElementById('status').textContent=`${filtered.length} upcoming verified shows across ${venues.size} mapped venues. Venues without verified coordinates are intentionally hidden.`}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function safeUrl(v){try{const u=new URL(v,location.origin);return /^https?:$/.test(u.protocol)?esc(u.href):'#'}catch{return '#'}}
</script></body></html>
