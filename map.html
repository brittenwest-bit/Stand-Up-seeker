<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Map · Stand Up Seeker</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:system-ui;background:#0c0c0f;color:#fff}header{padding:18px 22px;display:flex;gap:18px;align-items:center}a{color:#fff}#map{height:calc(100vh - 126px);min-height:440px}.note{padding:0 22px 14px;color:#bbb}.leaflet-popup-content{color:#111}.leaflet-popup-content a{color:#111}</style></head><body><header><strong>Stand Up Seeker · Map</strong><a href="/">Discover</a><a href="/calendar.html">Calendar</a></header><div class="note" id="status">Loading verified venue locations…</div><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([39,-98],4);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
fetch('/api/events?view=map').then(r=>r.json()).then(data=>{const events=data.events||[];const bounds=[];events.forEach(e=>{if(!Number.isFinite(e.latitude)||!Number.isFinite(e.longitude))return;const m=L.marker([e.latitude,e.longitude]).addTo(map);bounds.push([e.latitude,e.longitude]);const when=[e.date,e.time].filter(Boolean).join(' ');const ticket=e.ticketUrl?`<br><a href="${e.ticketUrl}" target="_blank" rel="noopener">Official tickets</a>`:'';m.bindPopup(`<strong>${esc(e.name)}</strong><br>${esc(e.venue)}<br>${esc(e.city)}, ${esc(e.state||e.country||'')}<br>${esc(when)}${ticket}`)});if(bounds.length)map.fitBounds(bounds,{padding:[30,30]});document.getElementById('status').textContent=`${events.length} upcoming shows at venues with verified coordinates. Venues without verified coordinates are intentionally hidden.`}).catch(()=>document.getElementById('status').textContent='Verified map data is temporarily unavailable.');
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
